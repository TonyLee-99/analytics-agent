# Simulated org chart for the demo deployment (NOT real City of Chicago staff or structure).
# Departments and their data are real (311 owner departments); people, groups and who-may-see-what
# are invented configuration for testing permission enforcement.
simulated: true
groups:
  all-staff:      {description: "Everyone with a city account (Simulated)", members: [dept-311, dept-cdot, dept-dss, dept-dwm, dept-dob, dept-cdph, perf-office, budget-office]}
  dept-311:       {description: "311 City Services", data: ["311"]}
  dept-cdot:      {description: "Transportation (CDOT)", data: [CDOT]}
  dept-dss:       {description: "Streets and Sanitation", data: [DSS], members: [dss-forestry]}
  dss-forestry:   {description: "Bureau of Forestry, nested in Streets and Sanitation"}
  dept-dwm:       {description: "Water Management", data: [DWM]}
  dept-dob:       {description: "Buildings", data: [DOB]}
  dept-cdph:      {description: "Public Health", data: [CDPH]}
  perf-office:    {description: "City-wide performance management office", data: ["*"]}
  budget-office:  {description: "Office of Budget and Management analysts (documents only, no warehouse rows)"}
