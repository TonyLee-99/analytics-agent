[project]
name = "analytics-agent"
version = "0.1.0"
description = "Enterprise text-to-SQL analytics agent: schema RAG, guarded execution, self-correction, evals"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb==2.0.0",
    "sqlglot==30.25.0",
    "rank-bm25==0.2.2",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
    "httpx==0.28.1",
    "mcp==2.3.0",
    "pyyaml==6.0.3",
    "matplotlib==3.11.2",
    "numpy==2.5.4",
]

[project.optional-dependencies]
embed = ["sentence-transformers==6.2.0"]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analytics_agent"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
