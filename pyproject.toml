[project]
name = "analytics-agent"
version = "0.1.0"
description = "Enterprise text-to-SQL analytics agent: schema RAG, guarded execution, self-correction, evals"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb",
    "sqlglot",
    "rank-bm25",
    "fastapi",
    "uvicorn",
    "pydantic",
    "httpx",
    "mcp",
    "pyyaml",
]

[project.optional-dependencies]
embed = ["sentence-transformers"]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analytics_agent"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
