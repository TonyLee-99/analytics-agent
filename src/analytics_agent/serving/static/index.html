<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ask the warehouse</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --ink:#1d2430; --muted:#6b7480; --line:#e3e6ea; --accent:#2a6fdb; --warn:#b35c00; --bg:#fafbfc; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; color:var(--ink); background:var(--bg); }
  main { max-width: 920px; margin: 0 auto; padding: 28px 20px 80px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin-bottom: 18px; font-size: 13px; }
  form { display:flex; gap:8px; }
  input[type=text] { flex:1; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-size:15px; background:#fff; }
  select, button { padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:#fff; font-size:14px; }
  button { background:var(--accent); color:#fff; border-color:var(--accent); cursor:pointer; }
  button:disabled { opacity:.5; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-top:16px; }
  .q { font-weight:600; margin-bottom:6px; }
  .meta { color:var(--muted); font-size:12px; margin-top:8px; }
  .badge { display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px; border:1px solid var(--line); margin-right:6px; }
  .review { color:var(--warn); border-color:#f0c48a; background:#fff7ec; }
  .clarify { color:var(--accent); border-color:#b9cdf3; background:#f1f6ff; }
  pre { background:#f5f7f9; padding:10px; border-radius:8px; overflow:auto; font-size:12.5px; }
  table { border-collapse:collapse; font-size:13px; margin-top:8px; }
  td, th { border-bottom:1px solid var(--line); padding:4px 10px; text-align:left; }
  details summary { cursor:pointer; color:var(--muted); font-size:13px; margin-top:8px; }
</style>
</head>
<body>
<main>
  <h1>Ask the warehouse</h1>
  <div class="sub">Plain-English questions over the Olist marketplace warehouse. Read-only, row-capped, PII-masked. Governed metric definitions are used when they apply.</div>
  <form id="f">
    <input id="q" type="text" placeholder="e.g. What was GMV by customer state in 2018?" autocomplete="off">
    <select id="db"><option value="olist">olist</option></select>
    <button id="go">Ask</button>
  </form>
  <div id="out"></div>
</main>
<script>
const f = document.getElementById('f'), out = document.getElementById('out'), go = document.getElementById('go');
function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
f.addEventListener('submit', async (e) => {
  e.preventDefault();
  const q = document.getElementById('q').value.trim(); if (!q) return;
  go.disabled = true;
  const card = document.createElement('div'); card.className = 'card';
  card.innerHTML = `<div class="q">${esc(q)}</div><div class="meta">thinking…</div>`;
  out.prepend(card);
  try {
    const r = await fetch('/ask', {method:'POST', headers:{'Content-Type':'application/json'},
                                   body: JSON.stringify({question:q, db_id:document.getElementById('db').value})});
    const a = await r.json();
    let html = `<div class="q">${esc(q)}</div>`;
    if (a.status === 'clarify') {
      html += `<span class="badge clarify">needs clarification</span><div>${esc(a.clarification)}</div>`;
    } else {
      if (a.needs_review) html += `<span class="badge review">low confidence: review before sharing</span>`;
      if (a.used_governed_metrics) html += `<span class="badge">governed metric</span>`;
      html += `<div>${esc(a.summary || (a.status === 'answered' ? '' : 'Could not answer: ' + a.error))}</div>`;
      if (a.columns && a.columns.length) {
        html += '<table><tr>' + a.columns.map(c => `<th>${esc(c)}</th>`).join('') + '</tr>' +
          a.rows.slice(0, 20).map(row => '<tr>' + row.map(v => `<td>${esc(v)}</td>`).join('') + '</tr>').join('') + '</table>';
        if (a.row_count > 20) html += `<div class="meta">showing 20 of ${a.row_count} rows</div>`;
      }
      html += `<details><summary>SQL</summary><pre>${esc(a.sql)}</pre></details>`;
    }
    const u = a.usage || {};
    html += `<div class="meta">status ${esc(a.status)} · confidence ${a.confidence ?? '–'} · ${u.llm_calls ?? 0} LLM calls · $${(u.cost_usd ?? 0).toFixed(4)} · ${u.latency_s ?? '?'} s · trace ${esc(a.trace_id)}</div>`;
    card.innerHTML = html;
  } catch (err) { card.innerHTML += `<div class="meta">error: ${esc(err)}</div>`; }
  go.disabled = false;
});
</script>
</body>
</html>
